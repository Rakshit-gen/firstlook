[project]
name = "firstlook"
version = "0.1.0"
description = "An on-call agent that takes the first look at an incident: it investigates, proposes a fix, and asks before doing anything"
readme = "README.md"
license = "MIT"
authors = [
    { name = "rakshit-gen", email = "sisodiarakshit456@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
]

[project.scripts]
firstlook = "firstlook.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
